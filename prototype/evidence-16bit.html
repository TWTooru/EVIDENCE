<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVIDENCE 1989: BLACK RAIN — 16-Bit Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07080d;
      color: #e8e6df;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
      user-select: none;
      -webkit-user-select: none;
      padding: 12px;
    }
    .header-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 15px;
      font-weight: bold;
      color: #ffb000;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(255, 176, 0, 0.45);
    }
    .badge {
      background: #e62e2e;
      color: #fff;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 3px;
      letter-spacing: 1px;
    }
    canvas {
      width: min(800px, 95vw, calc(76vh * (4 / 3)));
      aspect-ratio: 4 / 3;
      image-rendering: pixelated;
      border: 4px solid #26222b;
      box-shadow: 0 0 32px rgba(255, 34, 51, 0.2), 0 0 12px rgba(0, 0, 0, 0.9);
      background: #07080d;
      display: block;
      cursor: crosshair;
    }
    .quick-deck {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .deck-btn {
      background: #1c1920;
      color: #ffb000;
      border: 1px solid #443b4f;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 3px;
    }
    .deck-btn:hover, .deck-btn.active {
      background: #ffb000;
      color: #07080d;
    }
    .help {
      font-size: 12px;
      color: #8fa8d6;
      text-align: center;
      line-height: 1.6;
      max-width: 800px;
    }
    .help span { color: #ffb000; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header-bar">
    <span class="badge">16-BIT WAR</span>
    <span>EVIDENCE 1989: BLACK RAIN</span>
  </div>

  <canvas id="screen" width="320" height="240"></canvas>

  <div class="quick-deck">
    <button class="deck-btn" id="btnWipers">[1] 雨刷 WIPERS</button>
    <button class="deck-btn" id="btnLights">[2] 車前大燈 HEADLIGHTS</button>
    <button class="deck-btn" id="btnRoof">[W] 抬頭看天窗 ROOF</button>
    <button class="deck-btn" id="btnAim">[SHIFT] 舉起相機 AIM</button>
    <button class="deck-btn" id="btnShoot">[SPACE] 快門閃光 SHOOT</button>
  </div>

  <div class="help">
    [<span>A / D 或 ← / →</span>] 左右轉頭環顧車窗　[<span>W / ↑</span>] 抬頭看天窗/後照鏡　[<span>1</span>] 雨刷開關　[<span>2</span>] 車前大燈<br>
    [<span>按住 SHIFT 或 J / 右鍵</span>] 舉起相機對焦　[<span>SPACE 或 K / 左鍵</span>] 扣下快門引爆閃光燈
  </div>

  <script src="./evidence-16bit-core.js"></script>
  <script src="./evidence-16bit-render.js"></script>
  <script src="./evidence-16bit-audio.js"></script>
  <script>
    (function () {
      const C = window.Evidence16BitCore;
      const R = window.Evidence16BitRender;
      const A = window.Evidence16BitAudio;

      const canvas = document.getElementById('screen');
      const ctx = canvas.getContext('2d');
      const params = Object.fromEntries(new URLSearchParams(location.search));
      const state = C.createGame(C.makeConfig(params), Date.now());

      const keys = {};
      let pendingWipers = false;
      let pendingLights = false;
      let pendingShoot = false;
      let pendingAction = false;
      let mouseAimToggle = false;

      window.addEventListener('keydown', (e) => {
        A.init();
        keys[e.code] = true;
        if (e.code === 'Digit1' || e.code === 'KeyQ') pendingWipers = true;
        if (e.code === 'Digit2' || e.code === 'KeyE' || e.code === 'KeyS') pendingLights = true;
        if (e.code === 'Space' || e.code === 'KeyK' || e.code === 'Enter') {
          e.preventDefault();
          pendingShoot = true;
          pendingAction = true;
        }
      });

      window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
      });

      canvas.addEventListener('mousedown', (e) => {
        A.init();
        if (e.button === 2) {
          mouseAimToggle = !mouseAimToggle;
        } else {
          pendingAction = true;
          if (state.phase === 'PLAYING') {
            state.cockpit.vfActive = true;
            pendingShoot = true;
          }
        }
      });
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      document.getElementById('btnWipers').addEventListener('click', () => { A.init(); pendingWipers = true; });
      document.getElementById('btnLights').addEventListener('click', () => { A.init(); pendingLights = true; });
      document.getElementById('btnRoof').addEventListener('click', () => { A.init(); keys._roofToggle = !keys._roofToggle; });
      document.getElementById('btnAim').addEventListener('click', () => { A.init(); mouseAimToggle = !mouseAimToggle; });
      document.getElementById('btnShoot').addEventListener('click', () => {
        A.init();
        pendingAction = true;
        state.cockpit.vfActive = true;
        mouseAimToggle = true;
        pendingShoot = true;
      });

      let lastTime = performance.now();
      function frame(now) {
        const dt = Math.min(0.1, (now - lastTime) / 1000);
        lastTime = now;

        const input = {
          left: Boolean(keys.KeyA || keys.ArrowLeft),
          right: Boolean(keys.KeyD || keys.ArrowRight),
          lookUp: Boolean(keys.KeyW || keys.ArrowUp || keys._roofToggle),
          aim: Boolean(keys.ShiftLeft || keys.ShiftRight || keys.KeyJ || mouseAimToggle),
          toggleWipers: pendingWipers,
          toggleHeadlights: pendingLights,
          shoot: pendingShoot,
          action: pendingAction,
        };
        pendingWipers = false;
        pendingLights = false;
        pendingShoot = false;
        pendingAction = false;

        C.step(state, input, dt);
        for (const ev of state.events) {
          A.playEvent(ev);
        }
        if (state.phase === 'PLAYING') {
          A.updateRadio(state.cockpit.radioPan, state.cockpit.radioIntensity, state.cockpit.blackout);
        }

        R.draw(ctx, state);
        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
