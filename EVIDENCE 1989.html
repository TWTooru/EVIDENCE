<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVIDENCE 1989: BLACK RAIN — 16-Bit Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07080d;
      color: #e8e6df;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
      user-select: none;
      -webkit-user-select: none;
      padding: 12px;
    }
    .header-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 15px;
      font-weight: bold;
      color: #ffb000;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(255, 176, 0, 0.45);
    }
    .badge {
      background: #e62e2e;
      color: #fff;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 3px;
      letter-spacing: 1px;
    }
    canvas {
      width: min(800px, 95vw, calc(76vh * (4 / 3)));
      aspect-ratio: 4 / 3;
      image-rendering: pixelated;
      border: 4px solid #221f28;
      box-shadow: 0 0 32px rgba(255, 34, 51, 0.16), 0 0 12px rgba(0, 0, 0, 0.92);
      background: #07080d;
      display: block;
      cursor: crosshair;
    }
    .quick-deck {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .deck-btn {
      background: #16141a;
      color: #ffb000;
      border: 1px solid #3c3447;
      padding: 6px 14px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 3px;
    }
    .deck-btn:hover, .deck-btn.active {
      background: #ffb000;
      color: #07080d;
    }
    .help {
      font-size: 12px;
      color: #8fa8d6;
      text-align: center;
      line-height: 1.65;
      max-width: 780px;
    }
    .help span { color: #ffb000; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header-bar">
    <span class="badge">16-BIT</span>
    <span>EVIDENCE 1989: BLACK RAIN</span>
  </div>

  <canvas id="screen" width="1280" height="960"></canvas>

  <div class="quick-deck">
    <button class="deck-btn" id="btnLeft">[◀ A] 左轉頭</button>
    <button class="deck-btn" id="btnRight">[D ▶] 右轉頭</button>
    <button class="deck-btn" id="btnAim">[SHIFT] 舉起相機（遮住肉眼）</button>
    <button class="deck-btn" id="btnShoot">[SPACE] 快門閃光</button>
  </div>

  <div class="help">
    [<span>A / D 或 ← / →</span>] 轉頭巡視守望台窗戶（<b>正眼直視＝凍結黑影</b>，過久侵蝕滿載將撞裂玻璃）<br>
    <b>前半夜【取證】</b>：[<span>SHIFT / J / 右鍵</span>] 舉相機對焦誘敵 → [<span>SPACE / K / 左鍵</span>] 拍滿證據後放下相機<br>
    <b>後半夜【死守至 05:00 AM】</b>：極暗紅眼中 [<span>SHIFT / J / 右鍵</span>] 舉手電筒照亮五官 → 近距 [<span>SPACE / K / 左鍵</span>] 強光閃退！
  </div>

  <script>
/* EVIDENCE 1989: BLACK RAIN — Pure 16-bit "123 Wooden Man" Core Engine (Lookout Cabin Spatial Frame, Peripheral Vision & Optical Focus). */
(function (root) {
  'use strict';

  const SCREEN_W = 320;
  const SCREEN_H = 240;
  const WORLD_W = 640;
  const MAX_PAN_X = WORLD_W - SCREEN_W; // 320

  // World X centers for the 3 lookout cabin windows (classic proportions)
  const DIR_WORLD_X = {
    LEFT: 95,
    FRONT: 320,
    RIGHT: 545,
  };

  // Structural window pillars (mullions) dividing LEFT / FRONT / RIGHT panes
  const PILLAR_WORLD_X = {
    LEFT: 160,
    RIGHT: 468,
  };

  const DIRECT_GAZE_MIN_X = 24;
  const DIRECT_GAZE_MAX_X = SCREEN_W - 24; // 296

  const DEFAULTS = {
    panSpeed: 280,          // Horizontal head-turn speed (px/s)
    nightDuration: 75,      // Seconds per night (00:00 -> 05:00 AM)
    film: 4,                // Film exposures per night
    chargeTime: 2.5,        // Flash capacitor recharge time (s)
    blindTime: 1.0,         // Glass reflection whiteout blindness (s)
    approachSpeed: 0.055,   // Base creature approach rate when unwatched (dist/s)
    retreatDist: 0.92,      // Creature distance after flash hit
    evidenceDist: 0.34,     // Max distance for EVIDENCE grade (and 100% sharp optical focus)
    suspiciousDist: 0.65,   // Max distance for SUSPICIOUS grade
    vfW: 120,               // Camera optical viewfinder width (px)
    vfH: 96,                // Camera optical viewfinder height (px)
    maxStare: 2.8,          // Base direct-gaze duration (s) before psychic signal overload blackout
    blinkDuration: 0.22,    // Psychic optic blackout duration (s)
    waitMult: 0.55,         // Deceptive slow stalk multiplier in WAIT pose
    coilMult: 1.65,         // Explosive lunge multiplier in COIL pose
    lungeMult: 1.50,        // Point-blank lunge multiplier in LUNGE pose
    lungeDist: 0.36,        // Distance threshold where creature enters LUNGE pose
    flashlightDist: 0.42,   // Max distance for SURVIVAL flashlight blast relocation
    flashlightChargeTime: 2.2, // Flashlight capacitor recharge time (s)
    flashlightBlindTime: 0.65, // Flashlight blast glare duration (s)
    flashlightBeamR: 52,    // Flashlight beam radius (px)
    debug: 0,
  };

  function makeConfig(overrides) {
    const cfg = Object.assign({}, DEFAULTS);
    if (!overrides) return cfg;
    for (const key of Object.keys(DEFAULTS)) {
      const raw = overrides[key];
      if (raw === undefined || raw === null || raw === '') continue;
      const val = Number(raw);
      if (Number.isFinite(val)) cfg[key] = val;
    }
    return cfg;
  }

  function mulberry32(seed) {
    let a = (seed >>> 0) || 1;
    return function () {
      let t = (a += 0x6D2B79F5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(v, lo, hi) {
    return Math.min(hi, Math.max(lo, v));
  }

  function driftLateral(c, speed, dt) {
    const latDir = c.lateralDir || 1;
    c.offsetX = (c.offsetX || 0) + latDir * speed * dt;
    if (c.offsetX > 42) {
      c.offsetX = 42;
      c.lateralDir = -1;
    } else if (c.offsetX < -42) {
      c.offsetX = -42;
      c.lateralDir = 1;
    }
  }

  function nightSettings(night, cfg) {
    const n = clamp(night || 1, 1, 3);
    if (n === 1) {
      return {
        number: 1,
        title: 'NIGHT 1: FIRST SIGHTING',
        subtitle: 'DIRECT GAZE FREEZES IT. WATCH YOUR PERIPHERAL WINDOWS.',
        dirs: ['LEFT', 'FRONT', 'RIGHT'],
        creatureCount: 1,
        requiredEvidence: 2,
        approachMult: 1.0,
        rainMult: 1.0,
        shiftMin: 4.5,
        shiftSpan: 3.5,
        duration: cfg.nightDuration,
      };
    }
    if (n === 2) {
      return {
        number: 2,
        title: 'NIGHT 2: FRACTURED GLASS',
        subtitle: 'SPIDERWEB CRACKS REMAIN. IT FLANKS IN YOUR PERIPHERY.',
        dirs: ['LEFT', 'FRONT', 'RIGHT'],
        creatureCount: 1,
        requiredEvidence: 3,
        approachMult: 1.25,
        rainMult: 1.45,
        shiftMin: 3.2,
        shiftSpan: 2.4,
        duration: cfg.nightDuration,
      };
    }
    return {
      number: 3,
      title: 'NIGHT 3: TWO IN THE DARK',
      subtitle: 'TWO FIGURES. ONE IN YOUR GAZE, ONE IN YOUR PERIPHERY.',
      dirs: ['LEFT', 'FRONT', 'RIGHT'],
      creatureCount: 2,
      requiredEvidence: 3,
      approachMult: 1.18,
      rainMult: 1.85,
      shiftMin: 3.8,
      shiftSpan: 2.8,
      duration: cfg.nightDuration,
    };
  }

  function creatureWorldPos(c) {
    const base = DIR_WORLD_X[c.dir] || 320;
    return base + (c.offsetX || 0);
  }

  function creatureScreenRect(c, panX) {
    const near = clamp(1 - c.dist, 0, 1);
    const worldX = creatureWorldPos(c);
    const screenX = worldX - panX;

    const minH = 22;
    const maxH = 142;
    const h = Math.round(minH + (maxH - minH) * near);
    const w = Math.round(h * 0.42);
    const horizonY = 102;
    const feetNearY = 186;
    const feetY = Math.round(horizonY + (feetNearY - horizonY) * near);
    const x = Math.round(screenX - w / 2);
    const y = feetY - h;
    return {
      x,
      y,
      w,
      h,
      eyeX: screenX,
      eyeY: Math.round(y + h * 0.16),
      pose: c.pose || 'WAIT',
    };
  }

  // Checks if creature is within the direct central gaze cone of the currently watched window
  function isCreatureInViewCone(c, state) {
    if (!c || !state) return false;
    const { cockpit, camera } = state;
    if (camera.blindTimer > 0 || cockpit.blinkTimer > 0) return false;

    const rect = creatureScreenRect(c, cockpit.panX);
    return rect.eyeX >= DIRECT_GAZE_MIN_X && rect.eyeX <= DIRECT_GAZE_MAX_X;
  }

  // Checks if creature is visible in the adjacent window via peripheral vision (outside direct gaze cone, so it keeps moving!)
  function isCreatureInPeripheral(c, state) {
    if (!c || !state) return false;
    const { cockpit, camera } = state;
    if (camera.blindTimer > 0 || cockpit.blinkTimer > 0) return false;
    if (isCreatureInViewCone(c, state)) return false;

    const rect = creatureScreenRect(c, cockpit.panX);
    return rect.x + rect.w >= -4 && rect.x <= SCREEN_W + 4;
  }

  // Sacred 123 Wooden Man Rule:
  // Direct central naked-eye contact (!vfActive) locks the creature into 100% absolute statue stillness.
  // Raising the camera viewfinder (vfActive) covers your naked eyes behind the camera body, breaking eye contact!
  function isCreatureGazed(c, state) {
    if (!isCreatureInViewCone(c, state)) return false;
    if (state.cockpit.vfActive) return false;
    return true;
  }

  function overlapArea(a, b) {
    const w = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    const h = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    return w > 0 && h > 0 ? w * h : 0;
  }

  function getViewfinderRect(state) {
    const w = state.cfg.vfW;
    const h = state.cfg.vfH;
    const panX = state.cockpit && state.cockpit.panX !== undefined ? state.cockpit.panX : 160;
    const panRatio = (panX - 160) / 160; // -1 (LEFT) .. 0 (FRONT) .. +1 (RIGHT)
    const centerX = Math.round(SCREEN_W / 2 + panRatio * 65); // 95 (LEFT) .. 160 (FRONT) .. 225 (RIGHT)
    const x = clamp(Math.round(centerX - w / 2), 16, SCREEN_W - w - 16);
    const y = 54;
    return { x, y, w, h };
  }

  function gradePhoto(c, state) {
    if (!c) {
      return {
        grade: 'BLURRY',
        reason: 'NO_SUBJECT',
        reasonText: 'NO SUBJECT IN FRAME',
        score: 0,
        fill: 0,
        completeness: 0,
        dir: 'NONE',
        dist: 1,
        pose: 'WAIT',
      };
    }
    const vf = getViewfinderRect(state);
    const rect = creatureScreenRect(c, state.cockpit.panX);
    const area = rect.w * rect.h;
    const completeness = area > 0 ? overlapArea(vf, rect) / area : 0;
    const fill = clamp(1 - c.dist, 0, 1);

    const rawScore = fill * 0.65 + completeness * 0.35;
    const score = Math.round(clamp(rawScore * 100, 0, 100));

    let grade = 'BLURRY';
    let reason = 'TOO_FAR';
    let reasonText = 'OUT OF FOCUS — LET IT CREEP CLOSER';
    if (c.dist <= state.cfg.evidenceDist && completeness >= 0.55) {
      grade = 'EVIDENCE';
      reason = 'LOCKED';
      reasonText = 'SHARP FOCUS LOCKED — EVIDENCE!';
    } else if (c.dist <= state.cfg.evidenceDist && completeness < 0.55) {
      grade = completeness >= 0.3 ? 'SUSPICIOUS' : 'BLURRY';
      reason = 'OFF_CENTER';
      reasonText = 'OFF-CENTER — PAN TO FRAME IT';
    } else if (c.dist <= state.cfg.suspiciousDist && completeness >= 0.3 && score >= 35) {
      grade = 'SUSPICIOUS';
      reason = 'TOO_FAR';
      reasonText = 'STILL BLURRY — WAIT UNTIL SHARP';
    } else if (completeness < 0.3) {
      reason = 'OFF_CENTER';
      reasonText = 'OFF-CENTER — AIM AT THE FIGURE';
    }

    return {
      grade,
      reason,
      reasonText,
      score,
      fill: Number(fill.toFixed(2)),
      completeness: Number(completeness.toFixed(2)),
      dir: c.dir,
      dist: Number(c.dist.toFixed(2)),
      pose: c.pose || (c.dist <= state.cfg.lungeDist ? 'LUNGE' : 'WAIT'),
    };
  }

  function inspectViewfinderTarget(state) {
    const vf = getViewfinderRect(state);
    let bestCreature = null;
    let bestGrade = null;
    for (const c of state.creatures) {
      const rect = creatureScreenRect(c, state.cockpit.panX);
      const ov = overlapArea(vf, rect);
      if (ov > 0) {
        const g = gradePhoto(c, state);
        if (!bestGrade || g.score >= bestGrade.score) {
          bestCreature = c;
          bestGrade = g;
        }
      }
    }
    if (!bestCreature) {
      return {
        hasTarget: false,
        status: 'EMPTY',
        label: 'NO TARGET IN LENS',
        subLabel: 'TURN HEAD [A/D] TO FIND IT',
        focusRatio: 0,
        blurAmount: 0.88,
        completeness: 0,
        dist: 1,
      };
    }
    const focusRatio = clamp((1 - bestCreature.dist) / (1 - state.cfg.evidenceDist), 0, 1);
    const blurAmount = bestCreature.dist <= state.cfg.evidenceDist
      ? 0
      : clamp((bestCreature.dist - state.cfg.evidenceDist) / 0.44, 0.14, 1.0);
    if (bestGrade.grade === 'EVIDENCE') {
      return {
        hasTarget: true,
        status: 'LOCKED',
        label: 'SHARP — SHOOT [SPACE]!',
        subLabel: 'SHARP FOCUS (' + bestGrade.score + ' PTS)',
        focusRatio: 1,
        blurAmount: 0,
        completeness: bestGrade.completeness,
        dist: bestCreature.dist,
        creature: bestCreature,
      };
    }
    if (bestCreature.dist <= state.cfg.evidenceDist && bestGrade.completeness < 0.55) {
      return {
        hasTarget: true,
        status: 'OFF_CENTER',
        label: 'OFF-CENTER — ADJUST AIM [A/D]',
        subLabel: 'SHARP BUT OFF-CENTER',
        focusRatio: 0.88,
        blurAmount: 0.08,
        completeness: bestGrade.completeness,
        dist: bestCreature.dist,
        creature: bestCreature,
      };
    }
    return {
      hasTarget: true,
      status: 'APPROACHING',
      label: 'OUT OF FOCUS... HOLD SHIFT',
      subLabel: 'CLARIFYING (' + Math.round(focusRatio * 100) + '% FOCUS)',
      focusRatio,
      blurAmount,
      completeness: bestGrade.completeness,
      dist: bestCreature.dist,
      creature: bestCreature,
    };
  }

  function inspectFlashlightTarget(state) {
    const vf = getViewfinderRect(state);
    let bestCreature = null;
    for (const c of state.creatures) {
      const rect = creatureScreenRect(c, state.cockpit.panX);
      if (overlapArea(vf, rect) > 0) {
        if (!bestCreature || c.dist < bestCreature.dist) {
          bestCreature = c;
        }
      }
    }
    if (!bestCreature) {
      return {
        hasTarget: false,
        inBlastRange: false,
        dist: 1,
        illumination: 0,
        creature: null,
      };
    }
    const span = Math.max(0.01, 0.82 - state.cfg.flashlightDist);
    return {
      hasTarget: true,
      inBlastRange: bestCreature.dist <= state.cfg.flashlightDist,
      dist: bestCreature.dist,
      illumination: clamp((0.82 - bestCreature.dist) / span, 0.12, 1),
      creature: bestCreature,
    };
  }

  function spawnCreature(id, ns, rng, forceDir, speedScale) {
    const dirs = ns.dirs;
    const dir = forceDir || dirs[Math.floor(rng() * dirs.length)];
    const offsetX = Math.round((rng() - 0.5) * 36);
    return {
      id,
      dir,
      dist: Number((0.78 + rng() * 0.16).toFixed(3)),
      offsetX,
      lateralDir: rng() < 0.5 ? -1 : 1,
      shiftTimer: ns.shiftMin + rng() * ns.shiftSpan,
      speedScale: speedScale || 1.0,
      state: 'STALKING',
      pose: 'WAIT',          // 'WAIT' | 'COIL' | 'LUNGE'
      unwatchedTime: 0,      // Time spent unwatched since last direct eye contact
      lookAwayCount: 0,      // Number of times player broke direct eye contact
      slammedThisApproach: false,
      glintTimer: 0.8 + rng() * 0.8,
      glintVisible: 0,
      soundCooldown: 1.1 + rng() * 0.9,
    };
  }

  function createGame(config, seed) {
    const cfg = config || makeConfig();
    const rng = mulberry32(seed === undefined ? 19891103 : seed);
    return {
      cfg,
      rng,
      phase: 'TITLE', // TITLE | NIGHT_INTRO | PLAYING | NIGHT_SUMMARY | GAME_OVER | VICTORY
      endReason: null,
      breachDir: null,
      night: {
        number: 1,
        title: '',
        subtitle: '',
        timeElapsed: 0,
        duration: cfg.nightDuration,
        evidenceCount: 0,
        requiredEvidence: 2,
        subPhase: 'EVIDENCE',
      },
      cockpit: {
        panX: 160,            // 160 centers on FRONT window (320 - 160)
        vfActive: false,      // True while camera viewfinder is held up over naked eyes
        toolMode: 'CAMERA',   // 'CAMERA' | 'FLASHLIGHT'
        survivalBannerTimer: 0,
        overloadCount: 0,     // Cumulative psychic signal overloads this night (3rd overload = fatal breach!)
        eyeStrain: 0,         // 0..1 psychic signal interference from staring directly into the entity's eyes
        blinkTarget: 0.94,    // Organic overload threshold (0.88..1.0)
        blinkTimer: 0,        // >0 during psychic optic blackout
        stareDread: 0,        // 0..1 continuous psychological/tinnitus dread while locking eyes
        shakeTimer: 0,        // >0 violent cabin shake when creature slams onto window glass
        windowCracks: { LEFT: 0, FRONT: 0, RIGHT: 0 }, // Persistent cross-night spiderweb fracture state per window
        shootHintTimer: 0,    // >0 shows warning when pressing shutter without raising camera first
        lightningTimer: 4.5,
        lightningFlash: 0,
        heartbeatTimer: 0.5,
        rainAmbienceTimer: 0.25,
      },
      camera: {
        filmLeft: cfg.film,
        chargeTimer: 0,
        blindTimer: 0,
        lastPhoto: null,
        photoPopupTimer: 0,
        allPhotos: [],
      },
      creatures: [],
      events: [],
    };
  }

  function startNight(state, nightNum) {
    const ns = nightSettings(nightNum, state.cfg);
    state.phase = 'PLAYING';
    state.endReason = null;
    state.breachDir = null;
    state.night = {
      number: ns.number,
      title: ns.title,
      subtitle: ns.subtitle,
      timeElapsed: 0,
      duration: ns.duration,
      evidenceCount: 0,
      requiredEvidence: ns.requiredEvidence || 2,
      subPhase: 'EVIDENCE',
      escapedEarly: false,
      timeBonus: 0,
      settings: ns,
    };

    state.cockpit.panX = 160;
    state.cockpit.vfActive = false;
    state.cockpit.toolMode = 'CAMERA';
    state.cockpit.survivalBannerTimer = 0;
    state.cockpit.overloadCount = 0;
    state.cockpit.eyeStrain = 0;
    state.cockpit.blinkTarget = 0.88 + state.rng() * 0.12;
    state.cockpit.blinkTimer = 0;
    state.cockpit.stareDread = 0;
    state.cockpit.shakeTimer = 0;
    // Cross-Night Spiderweb Persistence: Only reset windowCracks on Night 1; Night 2 & Night 3 inherit existing spiderweb fractures!
    if (ns.number <= 1 || !state.cockpit.windowCracks) {
      state.cockpit.windowCracks = { LEFT: 0, FRONT: 0, RIGHT: 0 };
    }
    state.cockpit.shootHintTimer = 0;
    state.cockpit.lightningTimer = 3.5 + state.rng() * 4.5;
    state.cockpit.lightningFlash = 0;
    state.cockpit.heartbeatTimer = 0.45;
    state.cockpit.rainAmbienceTimer = 0.25;

    state.camera.filmLeft = state.cfg.film;
    state.camera.chargeTimer = 0;
    state.camera.blindTimer = 0;
    state.camera.lastPhoto = null;
    state.camera.photoPopupTimer = 0;

    state.creatures = [];
    const dirs = ns.dirs;
    const d0 = dirs[Math.floor(state.rng() * dirs.length)];
    state.creatures.push(spawnCreature(1, ns, state.rng, d0, 1.0));

    if (ns.creatureCount >= 2) {
      const otherDirs = dirs.filter((d) => d !== d0);
      const d1 = otherDirs[Math.floor(state.rng() * otherDirs.length)] || 'LEFT';
      const second = spawnCreature(2, ns, state.rng, d1, 0.62);
      second.dist = 0.94;
      state.creatures.push(second);
    }

    return state;
  }

  function pickUnoccupiedWindow(c, state, ns) {
    const occupied = state.creatures.filter((o) => o !== c).map((o) => o.dir);
    const diffDirs = ns.dirs.filter((d) => d !== c.dir);
    const freeDirs = diffDirs.filter((d) => !occupied.includes(d));
    const pool = freeDirs.length > 0 ? freeDirs : diffDirs;
    return pool.length > 0 ? pool[Math.floor(state.rng() * pool.length)] : ns.dirs[0];
  }

  function relocateCreature(c, state) {
    const ns = state.night.settings || nightSettings(state.night.number, state.cfg);
    c.dir = pickUnoccupiedWindow(c, state, ns);
    c.dist = state.cfg.retreatDist;
    c.offsetX = Math.round((state.rng() - 0.5) * 36);
    c.state = 'STALKING';
    c.pose = 'WAIT';
    c.unwatchedTime = 0;
    c.lookAwayCount = 0;
    c.slammedThisApproach = false;
    c.shiftTimer = ns.shiftMin + state.rng() * ns.shiftSpan;
  }

  function handleShutter(state, blastedSet) {
    const { camera, cockpit, cfg, night } = state;
    if (night.subPhase === 'SURVIVAL' || cockpit.toolMode === 'FLASHLIGHT') {
      if (camera.chargeTimer > 0) return false;
      camera.chargeTimer = cfg.flashlightChargeTime;
      camera.blindTimer = cfg.flashlightBlindTime;
      state.events.push({ type: 'FLASHLIGHT_BLAST' });

      const vf = getViewfinderRect(state);
      for (const c of state.creatures) {
        const rect = creatureScreenRect(c, cockpit.panX);
        const inAimedWindow = (rect.eyeX >= DIRECT_GAZE_MIN_X && rect.eyeX <= DIRECT_GAZE_MAX_X) || overlapArea(vf, rect) > 0;
        if (inAimedWindow) {
          if (c.dist <= cfg.flashlightDist) {
            state.events.push({ type: 'MONSTER_SCREAM', dir: c.dir });
            relocateCreature(c, state);
          } else {
            c.dist = Math.min(0.95, Number((c.dist + 0.08).toFixed(3)));
            c.unwatchedTime = 0;
          }

      const lungeW = Math.round(shoulderW * 1.28);
      ctx.fillRect(Math.round(cx - lungeW / 2), Math.round(r.y + headR * 1.15), lungeW, Math.round(r.h * 0.38));
      ctx.fillRect(Math.round(cx - torsoW / 2), Math.round(r.y + headR * 1.65), torsoW, Math.round(r.h * 0.52));
      ctx.fillRect(Math.round(headCenterX - headR * 1.08), headTopY, Math.round(headR * 2.16), Math.round(headR * 2.05));
      const clawH = Math.round(r.h * 0.58);
      ctx.fillRect(Math.round(cx - lungeW / 2 - armW - 1), Math.max(2, Math.round(r.y - headR * 0.7)), armW + 2, clawH);
      ctx.fillRect(Math.round(cx + lungeW / 2 - 1), Math.max(2, Math.round(r.y - headR * 0.7)), armW + 2, clawH);
    }

    if (rimColor) {
      ctx.fillStyle = rimColor;
      const rimW = pose === 'COIL' ? Math.round(shoulderW * 1.38) : shoulderW;
      const rimY = pose === 'COIL' ? Math.round(r.y + r.h * 0.14 + headR * 0.8) : Math.round(r.y + headR * 1.5);
      ctx.fillRect(Math.round(cx - rimW / 2), rimY, rimW, 2);
      ctx.fillRect(Math.round(headCenterX - headR), headTopY, headR * 2, 2);
    }
  }

  function drawCreature16Bit(ctx, c, state) {
    const { cockpit } = state;
    const r = C.creatureScreenRect(c, cockpit.panX);
    if (r.x + r.w < -8 || r.x > W + 8) return;

    const isSurvival = state.night && state.night.subPhase === 'SURVIVAL';
    const inCone = C.isCreatureInViewCone(c, state);
    const inPeripheral = C.isCreatureInPeripheral ? C.isCreatureInPeripheral(c, state) : !inCone;
    const litByFlashlight = isSurvival && cockpit.vfActive && inCone && state.camera.blindTimer <= 0;
    const lightningLit = (cockpit.lightningFlash || 0) > 0.12;
    const time = state.night ? state.night.timeElapsed : 0;

    // 1. PERIPHERAL VISION OPPRESSION (Teacher Feedback #3):
    // When looking at Window A, the adjacent Window B is visible in the peripheral margin beyond the pillar.
    // Because your central gaze is NOT on Window B, the creature in Window B is NOT frozen — you see its dark silhouette creeping in the corner of your eye!
    if (!inCone && inPeripheral) {
      const strideBob = Math.round(Math.sin(time * 8.5 + c.id) * 2);
      const strideSway = Math.round(Math.cos(time * 5.5 + c.id) * 2);
      const pcx = Math.round(r.x + r.w / 2) + strideSway;
      const pHeadR = Math.max(4, Math.round(r.w * 0.34));
      const pShoulderW = Math.round(r.w * 1.16);
      const pTorsoW = Math.round(r.w * 0.66);
      const pArmW = Math.max(2, Math.round(r.w * 0.18));
      const pPose = c.pose || 'WAIT';
      const pHeadY = (pPose === 'COIL' ? Math.round(r.y + r.h * 0.14) : r.y) + strideBob;
      const pHeadX = pcx + (pPose === 'WAIT' ? Math.max(2, Math.round(pHeadR * 0.35)) : 0);

      ctx.save();
      ctx.globalAlpha = clamp(0.68 + (1 - c.dist) * 0.28, 0.65, 0.96);
      if (!isSurvival || lightningLit) {
        drawCreatureBodyPass(
          ctx,
          pcx,
          { x: r.x, y: r.y + strideBob, w: r.w, h: r.h },
          pHeadR,
          pShoulderW,
          pTorsoW,
          pArmW,
          pPose,
          pHeadX,
          pHeadY,
          PAL.creatureShadow,
          PAL.creatureRim
        );
      } else if (c.dist <= 0.34) {
        ctx.fillStyle = PAL.breathFog;
        ctx.fillRect(Math.round(pHeadX - pHeadR * 1.35), Math.round(pHeadY + pHeadR * 0.55), Math.round(pHeadR * 2.7), Math.round(pHeadR * 1.6));
      }
      // Crimson eyes gleaming in your peripheral vision as it stalks closer!
      const pEyeY = (pPose === 'COIL' ? Math.round(r.eyeY + r.h * 0.12) : r.eyeY) + strideBob;
      const pEyeSep = Math.max(3, Math.round(pHeadR * 0.52));
      const pEyeSize = (isSurvival && c.dist <= state.cfg.lungeDist) ? 3 : 2;
      ctx.fillStyle = PAL.eyeRed;
      ctx.fillRect(Math.round(pHeadX - pEyeSep - 1), pEyeY, pEyeSize, pEyeSize);
      ctx.fillRect(Math.round(pHeadX + pEyeSep - 1), pEyeY, pEyeSize, pEyeSize);
      ctx.restore();
      return;
    }

    // 2. OPTICAL VIEWFINDER BLUR-TO-SHARP (Teacher Feedback #1):
    // When the camera is raised (vfActive), if the creature is still too far (> evidenceDist),
    // it appears blurry/out-of-focus in the viewfinder and progressively sharpens as it approaches!
    const vfBlur = (!isSurvival && cockpit.vfActive && inCone)
      ? (c.dist <= state.cfg.evidenceDist ? 0 : clamp((c.dist - state.cfg.evidenceDist) / 0.44, 0.14, 1.0))
      : 0;

    const cx = Math.round(r.x + r.w / 2);
    const headR = Math.max(4, Math.round(r.w * 0.34));
    const shoulderW = Math.round(r.w * 1.18);
    const torsoW = Math.round(r.w * 0.68);
    const armW = Math.max(2, Math.round(r.w * 0.18));
    const pose = c.pose || 'WAIT';
    const strain = cockpit.eyeStrain || 0;

    // Subliminal broken-neck snap during intense psychic interference (> 0.56)
    const subliminalSnap = (!cockpit.vfActive && strain > 0.56 && Math.sin(time * 33) > 0.86)
      ? Math.max(3, Math.round(headR * 0.55)) * (c.id % 2 === 0 ? -1 : 1)
      : 0;
    const stareReveal = clamp(strain * 1.25 + (1 - c.dist) * 0.65, 0, 1);

    const headOffset = pose === 'WAIT' ? Math.max(2, Math.round(headR * 0.42)) : 0;
    const headCenterX = cx + headOffset + subliminalSnap;
    const headTopY = pose === 'COIL' ? Math.round(r.y + r.h * 0.14) : r.y;

    // SURVIVAL unlit pitch darkness: hide body silhouette, render ONLY red eyes (+ close breath fog)
    if (isSurvival && !litByFlashlight && !lightningLit) {
      const swayX = !inCone ? Math.round(Math.cos(time * 5.5 + c.id) * 2) : 0;
      const swayY = !inCone ? Math.round(Math.sin(time * 8.5 + c.id) * 2) : 0;
      const eyeY = (pose === 'COIL' ? Math.round(r.eyeY + r.h * 0.12) : r.eyeY) + swayY;
      const eyeSep = Math.max(3, Math.round(headR * 0.52));
      const eyeSize = c.dist <= state.cfg.lungeDist ? 3 : 2;
      if (c.dist <= 0.34) {
        ctx.fillStyle = PAL.breathFog;
        ctx.fillRect(
          Math.round(headCenterX + swayX - headR * 1.35),
          Math.round(eyeY + headR * 0.15),
          Math.round(headR * 2.7),
          Math.round(headR * 1.6)
        );
      }
      ctx.fillStyle = PAL.eyeRed;
      ctx.fillRect(Math.round(headCenterX + swayX - eyeSep - 1), eyeY, eyeSize, eyeSize);
      ctx.fillRect(Math.round(headCenterX + swayX + eyeSep - 1), eyeY, eyeSize, eyeSize);
      return;
    }

    if (vfBlur > 0.05) {
      // Out-of-focus ghosted silhouette passes (spread shrinks to 0 as creature approaches focus distance!)
      const spreadX = Math.max(2, Math.round(vfBlur * 11));
      const spreadY = Math.max(1, Math.round(vfBlur * 5));
      const offsets = [
        [-spreadX, 0],
        [spreadX, 0],
        [-Math.ceil(spreadX * 0.55), -spreadY],
        [Math.ceil(spreadX * 0.55), spreadY],
        [0, 0],
      ];
      ctx.save();
      for (let i = 0; i < offsets.length; i++) {
        const [ox, oy] = offsets[i];
        ctx.globalAlpha = i === offsets.length - 1 ? 0.52 : 0.24;
        drawCreatureBodyPass(
          ctx,
          cx + ox,
          { x: r.x + ox, y: r.y + oy, w: r.w, h: r.h },
          headR,
          shoulderW,
          torsoW,
          armW,
          pose,
          headCenterX + ox,
          headTopY + oy,
          PAL.creatureShadow,
          i === offsets.length - 1 ? PAL.creatureRim : null
        );
      }
      // Out-of-focus diffused red bokeh circles for the eyes (coalescing into sharp points as vfBlur -> 0)
      const eyeY = pose === 'COIL' ? Math.round(r.eyeY + r.h * 0.12) : r.eyeY;
      const eyeSep = Math.max(3, Math.round(headR * 0.52));
      const bokehSize = Math.max(3, Math.round(2 + vfBlur * 5));
      ctx.globalAlpha = clamp(0.55 - vfBlur * 0.25, 0.22, 0.55);
      ctx.fillStyle = PAL.eyeRed;
      ctx.fillRect(Math.round(headCenterX - eyeSep - bokehSize / 2), Math.round(eyeY - bokehSize / 2), bokehSize, bokehSize);
      ctx.fillRect(Math.round(headCenterX + eyeSep - bokehSize / 2), Math.round(eyeY - bokehSize / 2), bokehSize, bokehSize);
      ctx.restore();
      return;
    }

    const eyeY = pose === 'COIL' ? Math.round(r.eyeY + r.h * 0.12) : r.eyeY;
    const eyeSep = Math.max(3, Math.round(headR * 0.52));

    // SURVIVAL flashlight beam at far range (> flashlightDist): dim body silhouette + red eyes only
    if (litByFlashlight && c.dist > state.cfg.flashlightDist) {
      ctx.save();
      ctx.globalAlpha = clamp((0.88 - c.dist) / 0.46, 0.32, 0.85);
      drawCreatureBodyPass(ctx, cx, r, headR, shoulderW, torsoW, armW, pose, headCenterX, headTopY, PAL.creatureShadow, PAL.creatureRim);
      ctx.restore();
      const eyeSize = c.dist <= state.cfg.lungeDist ? 3 : 2;
      ctx.fillStyle = PAL.eyeRed;
      ctx.fillRect(Math.round(headCenterX - eyeSep - 1), eyeY, eyeSize, eyeSize);
      ctx.fillRect(Math.round(headCenterX + eyeSep - 1), eyeY, eyeSize, eyeSize);
      return;
    }

    const flashClose = litByFlashlight && c.dist <= state.cfg.flashlightDist;

    // 3. RAZOR-SHARP RENDERING (Direct Gaze, In-Focus Viewfinder, or Close Flashlight Illumination!)
    drawCreatureBodyPass(ctx, cx, r, headR, shoulderW, torsoW, armW, pose, headCenterX, headTopY, PAL.creatureShadow, PAL.creatureRim);

    if (pose === 'LUNGE' || flashClose) {
      const lungeW = Math.round(shoulderW * 1.28);
      if (c.dist <= state.cfg.evidenceDist || flashClose) {
        ctx.fillStyle = PAL.breathFog;
        ctx.fillRect(Math.round(headCenterX - headR * 1.35), Math.round(r.eyeY + headR * 0.15), Math.round(headR * 2.7), Math.round(headR * 1.6));
      }
      if (c.dist <= 0.24 || flashClose) {
        const palmY = pose === 'LUNGE'
          ? Math.round(headTopY + headR * 0.85)
          : Math.round(r.y + headR * 1.6 + r.h * 0.52);
        const leftPalmX = Math.round(cx - lungeW * 0.68);
        const rightPalmX = Math.round(cx + lungeW * 0.52);
        ctx.fillStyle = PAL.corpseDim;
        ctx.fillRect(leftPalmX, palmY, 10, 12);
        ctx.fillRect(rightPalmX, palmY, 10, 12);
        ctx.fillStyle = PAL.corpsePale;
        for (let f = 0; f < 4; f++) {
          ctx.fillRect(leftPalmX - 1 + f * 3, palmY - 9, 2, 10);
          ctx.fillRect(rightPalmX - 1 + f * 3, palmY - 9, 2, 10);
        }
      }
    }

    const rimY = pose === 'COIL' ? Math.round(r.y + r.h * 0.14 + headR * 0.8) : Math.round(r.y + headR * 1.5);
    if ((stareReveal > 0.48 || cockpit.vfActive || flashClose) && headR >= 7) {
      ctx.fillStyle = flashClose ? PAL.corpsePale : PAL.corpseDim;
      for (let rib = 0; rib < 3; rib++) {
        ctx.fillRect(Math.round(cx - torsoW * 0.32), rimY + 8 + rib * 5, Math.round(torsoW * 0.64), 1);
      }
    }

    // Uncanny Eyes & Rictus Grin: razor-sharp when in-focus in viewfinder, close in flashlight, or stared at!
    if (stareReveal > 0.36 || (cockpit.vfActive && c.dist <= state.cfg.evidenceDist) || flashClose) {
      const scleraW = (c.dist <= 0.28 || flashClose) ? 6 : (headR >= 8 ? 4 : 3);
      const scleraH = (c.dist <= 0.28 || flashClose) ? 5 : 3;
      ctx.fillStyle = PAL.corpsePale;
      ctx.fillRect(Math.round(headCenterX - eyeSep - scleraW / 2), eyeY - 1, scleraW, scleraH);
      ctx.fillRect(Math.round(headCenterX + eyeSep - scleraW / 2), eyeY - 1, scleraW, scleraH);
      ctx.fillStyle = PAL.voidBlack;
      ctx.fillRect(Math.round(headCenterX - eyeSep), eyeY, 2, 2);
      ctx.fillRect(Math.round(headCenterX + eyeSep), eyeY, 2, 2);
      ctx.fillStyle = PAL.eyeRed;
      ctx.fillRect(Math.round(headCenterX - eyeSep), eyeY, 1, 1);
      ctx.fillRect(Math.round(headCenterX + eyeSep), eyeY, 1, 1);
    } else {
      const eyeSize = c.dist <= state.cfg.lungeDist ? 3 : 2;
      ctx.fillStyle = PAL.eyeRed;
      ctx.fillRect(Math.round(headCenterX - eyeSep - 1), eyeY, eyeSize, eyeSize);
      ctx.fillRect(Math.round(headCenterX + eyeSep - 1), eyeY, eyeSize, eyeSize);
    }

    if (stareReveal > 0.52 || pose === 'LUNGE' || (cockpit.vfActive && c.dist <= state.cfg.evidenceDist) || flashClose) {
      const mouthW = Math.max(4, Math.round(headR * 0.95));
      const mouthH = (c.dist <= 0.34 || flashClose) ? Math.max(6, Math.round(headR * 0.80)) : Math.max(3, Math.round(headR * 0.45));
      const mouthX = Math.round(headCenterX - mouthW / 2);
      const mouthY = Math.round(eyeY + Math.max(4, headR * 0.48));
      ctx.fillStyle = PAL.voidBlack;
      ctx.fillRect(mouthX - 1, mouthY - 1, mouthW + 2, mouthH + 2);
      ctx.fillStyle = (c.dist <= 0.34 || flashClose) ? PAL.corpsePale : PAL.corpseDim;
      for (let tx = 0; tx < mouthW; tx += 2) {
        ctx.fillRect(mouthX + tx, mouthY, 1, mouthH);
      }
    }
  }

  function drawExteriorLayers(ctx, state) {
    const { cockpit } = state;
    const panX = cockpit.panX;
    const horizonY = 104;
    const isSurvival = state.night && state.night.subPhase === 'SURVIVAL';
    const pitchBlack = isSurvival && (cockpit.lightningFlash || 0) <= 0.1;

    // Layer 1: Storm Sky & Lightning
    ctx.fillStyle = cockpit.lightningFlash > 0.1 ? PAL.lightningSky : (pitchBlack ? PAL.voidBlack : PAL.nightSky);
    ctx.fillRect(0, 0, W, horizonY);

    if (!pitchBlack) {
      ctx.fillStyle = PAL.stormCloud;
      for (let i = 0; i < 6; i++) {
        const cx = ((i * 110 - Math.round(panX * 0.2)) % (W + 120)) - 40;
        ctx.fillRect(cx, 14 + (i % 2) * 12, 86, 10);
      }
    }

    // Mud ground
    ctx.fillStyle = pitchBlack ? PAL.voidBlack : PAL.mudGround;
    ctx.fillRect(0, horizonY, W, H - horizonY);

    // Layer 2: Far pine treeline (Parallax 0.55)
    for (const t of FOREST_TREES) {
      if (t.layer === 1) {
        const sx = t.wx - panX * 0.55;
        drawPine16Bit(ctx, sx, horizonY + 12, Math.round(t.w * 0.75), Math.round(t.h * 0.75), pitchBlack ? PAL.voidBlack : PAL.farPine, null);
      }
    }

    // Creatures lurking in the treeline
    for (const c of state.creatures) {
      drawCreature16Bit(ctx, c, state);
    }

    // Near/midground pine trees (Parallax 0.85)
    for (const t of FOREST_TREES) {
      if (t.layer === 2) {
        const sx = t.wx - panX * 0.85;
        const rim = cockpit.lightningFlash > 0.1 ? PAL.lightningSky : (pitchBlack ? null : PAL.creatureRim);
        drawPine16Bit(ctx, sx, horizonY + 34, t.w, t.h, pitchBlack ? PAL.voidBlack : PAL.midPine, rim);
      }
    }
  }

  // Clean v1 8-ray spiderweb glass fracture (carries across Night 1 -> Night 2 -> Night 3)
  function drawWindowCrack16Bit(ctx, screenX, cy, level) {
    if (screenX < -60 || screenX > W + 60 || !level) return;
    const scale = level >= 2 ? 1.15 : 0.85;
    const rays = [
      [-34, -30], [32, -32], [-42, -4], [44, -2],
      [-36, 18], [38, 22], [-18, 38], [22, 40],
    ];
    ctx.strokeStyle = PAL.corpsePale;
    ctx.lineWidth = 1;
    // Concentric spiderweb rings (clean v1 density)
    const ringScales = level >= 2 ? [0.28, 0.56, 0.86, 1.12] : [0.35, 0.72];
    for (const rs of ringScales) {
      ctx.beginPath();
      for (let i = 0; i < rays.length; i++) {
        const [dx, dy] = rays[i];
        const px = Math.round(screenX + dx * scale * rs);
        const py = Math.round(cy + dy * scale * rs);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    }
    // Radial impact lines from center
    ctx.beginPath();
    for (const [dx, dy] of rays) {
      ctx.moveTo(screenX, cy);
      ctx.lineTo(Math.round(screenX + dx * scale), Math.round(cy + dy * scale));
    }
    ctx.stroke();
    // Impact core point
    ctx.fillStyle = PAL.corpsePale;
    ctx.fillRect(screenX - 2, cy - 2, 5, 5);
  }

  function drawWindowGlassLayer(ctx, state) {
    const panX = state.cockpit.panX;
    const time = state.night.timeElapsed || 0;

    // Atmospheric 16-bit rain streaks across all lookout glass panes
    ctx.fillStyle = PAL.rainStreak;
    for (let i = 0; i < 36; i++) {
      const rx = ((i * 37 + Math.round(time * 88) - Math.round(panX * 0.9)) % W + W) % W;
      const ry = ((i * 53 + Math.round(time * 205)) % 168);
      ctx.fillRect(rx, ry, 1, 7);
    }

    // Persistent cross-night 16-bit spiderweb window cracks (retained across Night 1 -> Night 2 -> Night 3!)
    const cracks = state.cockpit.windowCracks || {};
    for (const dir of ['LEFT', 'FRONT', 'RIGHT']) {
      if (cracks[dir] > 0) {
        const wx = C.DIR_WORLD_X[dir] || 320;
        drawWindowCrack16Bit(ctx, Math.round(wx - panX), 96, cracks[dir]);
      }
    }
  }

  function drawCockpitInterior(ctx, state) {
    const { cockpit, camera, night } = state;
    const panX = cockpit.panX;
    const time = night.timeElapsed || 0;

    // Lookout Tower / Observation Cabin timber-and-steel upper lintel
    const roofH = 22;
    ctx.fillStyle = PAL.cockpitDark;
    ctx.fillRect(0, 0, W, roofH);
    ctx.fillStyle = PAL.cockpitLeather;
    ctx.fillRect(0, roofH - 4, W, 4);

    // Classic Structural Window Pillars at World X = 160 and 468
    const leftPillarX = Math.round(160 - panX);
    const rightPillarX = Math.round(468 - panX);
    ctx.fillStyle = PAL.cockpitDark;
    ctx.fillRect(leftPillarX, 0, 18, H);
    ctx.fillRect(rightPillarX, 0, 18, H);
    ctx.fillStyle = PAL.cockpitLeather;
    ctx.fillRect(leftPillarX + 15, 0, 3, H);
    ctx.fillRect(rightPillarX, 0, 3, H);

    // Outer cabin corner frames (World X <= 14 and >= 626)
    ctx.fillStyle = PAL.cockpitDark;
    ctx.fillRect(0, 0, Math.max(0, 14 - panX), H);
    const rightEdge = Math.round(626 - panX);
    if (rightEdge < W) ctx.fillRect(rightEdge, 0, W - rightEdge, H);

    // Lookout Cabin Wooden/Metal Window Sill (No steering wheel, no rearview mirror — pure claustrophobic observation post!)
    const sillY = 174;
    ctx.fillStyle = PAL.cockpitLeather;
    ctx.fillRect(0, sillY - 4, W, 6);
    ctx.fillStyle = PAL.dashPanel;
    ctx.fillRect(0, sillY + 2, W, H - (sillY + 2));
    ctx.fillStyle = PAL.cockpitTrim;
    ctx.fillRect(0, sillY + 2, W, 2);

    // Diegetic desk quartz clock on the center window sill (00:00 -> 05:00 AM)
    const progress = clamp(night.timeElapsed / Math.max(1, night.duration), 0, 1);
    const hour = Math.floor(progress * 5);
    const min = Math.floor((progress * 300) % 60);
    const clockStr = '0' + hour + ':' + (min < 10 ? '0' + min : min) + ' AM';

    const clockBoxX = Math.round(320 - panX) - 32;
    if (clockBoxX + 64 > 0 && clockBoxX < W) {
      ctx.fillStyle = PAL.voidBlack;
      ctx.fillRect(clockBoxX, sillY + 14, 64, 18);
      ctx.strokeStyle = PAL.cockpitTrim;
      ctx.strokeRect(clockBoxX, sillY + 14, 64, 18);
      text(ctx, clockStr, clockBoxX + 32, sillY + 19, PAL.quartzGreen, 8, 'center');
    }

    // Kodak 1600 film box resting on the right window sill
    const passX = Math.round(502 - panX);
    if (passX + 100 > 0 && passX < W) {
      ctx.fillStyle = PAL.cockpitLeather;
      ctx.fillRect(passX + 10, sillY + 12, 82, 32);
      ctx.strokeStyle = PAL.amberDim;
      ctx.strokeRect(passX + 10, sillY + 12, 82, 32);
      text(ctx, 'KODAK 1600', passX + 16, sillY + 17, PAL.amberGlow, 7);
      text(ctx, 'EXP: ' + camera.filmLeft, passX + 16, sillY + 29, PAL.polaroidWhite, 8);
    }

    const isSurvival = night && night.subPhase === 'SURVIVAL';

    // Put-down 35mm SLR camera resting on the left window sill once EVIDENCE phase is complete
    if (isSurvival) {
      const camX = Math.round(210 - panX);
      const camY = sillY + 10;
      if (camX + 56 > 0 && camX < W) {
        ctx.fillStyle = PAL.voidBlack;
        ctx.fillRect(camX, camY + 4, 42, 20);
        ctx.fillRect(camX + 12, camY, 18, 5);
        ctx.fillStyle = PAL.cockpitTrim;
        ctx.fillRect(camX + 1, camY + 5, 40, 4);
        ctx.fillStyle = PAL.corpseDim;
        ctx.fillRect(camX + 34, camY + 2, 4, 2);
        ctx.fillStyle = PAL.cockpitDark;
        ctx.fillRect(camX + 14, camY + 9, 14, 12);
        ctx.strokeStyle = PAL.corpseDim;
        ctx.lineWidth = 1;
        ctx.strokeRect(camX + 14, camY + 9, 14, 12);
        ctx.fillStyle = PAL.voidBlack;
        ctx.fillRect(camX + 17, camY + 12, 8, 6);
        text(ctx, 'SLR (DONE)', camX + 21, camY + 27, PAL.amberDim, 7, 'center');
      }
    }

    // Subtle top headliner strip (Night, Time, Film/Flashlight, Proof/Survive)
    const reqEv = night.requiredEvidence || (night.settings && night.settings.requiredEvidence) || 2;
    ctx.fillStyle = 'rgba(7, 8, 13, 0.72)';
    ctx.fillRect(6, 4, 308, 13);
    text(ctx, 'NIGHT ' + night.number, 10, 6, PAL.amberDim, 8);
    if (isSurvival) {
      text(ctx, clockStr, 82, 6, PAL.polaroidWhite, 8);
      text(ctx, 'FLASHLIGHT', 152, 6, PAL.amberGlow, 8);
      text(ctx, 'SURVIVE->5AM', 228, 6, PAL.quartzGreen, 8);
    } else {
      text(ctx, clockStr, 86, 6, PAL.polaroidWhite, 8);
      text(ctx, 'FILM:' + camera.filmLeft, 166, 6, camera.filmLeft > 0 ? PAL.amberGlow : PAL.dangerRed, 8);
      text(ctx, 'PROOF:' + night.evidenceCount + '/' + reqEv, 238, 6, night.evidenceCount >= reqEv ? PAL.quartzGreen : PAL.amberDim, 8);
    }

    // Peripheral Vision Oppression (Teacher Feedback #3):

    tritoneOsc.start();
    shriekOsc.start();
    tremorLfo.start();
    ringOsc.start();
    ringOsc2.start();

    dreadNodes = {
      subOsc,
      tritoneOsc,
      shriekOsc,
      ringOsc,
      ringOsc2,
      tremorLfo,
      tremorGain,
      lowFilter,
      subGain,
      shriekGain,
      ringGain,
    };
  }

  function ensureMusicNodes() {
    if (!ac || !master || musicNodes) return;
    const abyssOsc = ac.createOscillator();
    const fifthAbyssOsc = ac.createOscillator();
    const darkPadOsc1 = ac.createOscillator();
    const darkPadOsc2 = ac.createOscillator();
    const wobbleLfo = ac.createOscillator();
    const wobbleGain = ac.createGain();
    const padFilter = ac.createBiquadFilter();
    const abyssGain = ac.createGain();
    const padGain = ac.createGain();

    // Deep 36.7Hz (D1) + 51.9Hz (Ab1 tritone) sub-abyssal foundation
    abyssOsc.type = 'triangle';
    abyssOsc.frequency.value = 36.71;
    fifthAbyssOsc.type = 'sine';
    fifthAbyssOsc.frequency.value = 51.91;

    // Claustrophobic minor-second dark synth pad (D3 146.8Hz vs Eb3 155.6Hz)
    darkPadOsc1.type = 'sawtooth';
    darkPadOsc1.frequency.value = 73.42;
    darkPadOsc2.type = 'sawtooth';
    darkPadOsc2.frequency.value = 77.78;

    // Tape-warble LFO (1989 VHS pitch sickness)
    wobbleLfo.type = 'sine';
    wobbleLfo.frequency.value = 0.28;
    wobbleGain.gain.value = 1.6;

    padFilter.type = 'lowpass';
    padFilter.frequency.value = 195;

    abyssGain.gain.value = 0;
    padGain.gain.value = 0;

    try {
      wobbleLfo.connect(wobbleGain);
      wobbleGain.connect(darkPadOsc1.frequency);
      wobbleGain.connect(darkPadOsc2.frequency);
    } catch (e) { /* fallback for mock nodes */ }

    abyssOsc.connect(abyssGain);
    fifthAbyssOsc.connect(abyssGain);
    darkPadOsc1.connect(padFilter);
    darkPadOsc2.connect(padFilter);
    padFilter.connect(padGain);

    abyssGain.connect(master);
    padGain.connect(master);

    abyssOsc.start();
    fifthAbyssOsc.start();
    darkPadOsc1.start();
    darkPadOsc2.start();
    wobbleLfo.start();

    musicNodes = {
      abyssOsc,
      fifthAbyssOsc,
      darkPadOsc1,
      darkPadOsc2,
      wobbleLfo,
      wobbleGain,
      padFilter,
      abyssGain,
      padGain,
    };
  }

  // Continuous psychological dread drone + rising binaural tinnitus + pre-blink panic tremor!
  function updateStareDread(dreadLevel, eyeStrain) {
    if (!ac) return;
    ensureDreadNodes();
    if (!dreadNodes) return;

    const d = Math.max(0, Math.min(1, dreadLevel || 0));
    const s = Math.max(0, Math.min(1, eyeStrain || 0));
    const now = ac.currentTime;

    const targetSub = d > 0.04 ? (0.06 + d * d * 0.38) : 0;
    const targetShriek = s > 0.32 ? ((s - 0.32) * 0.24) : 0;
    const targetRing = d > 0.12 ? ((d - 0.12) * 0.11 + s * 0.09) : 0;

    setParam(dreadNodes.subGain.gain, targetSub, now, 0.06);
    setParam(dreadNodes.shriekGain.gain, targetShriek, now, 0.06);
    setParam(dreadNodes.ringGain.gain, targetRing, now, 0.06);

    setParam(dreadNodes.subOsc.frequency, 42 + d * 24, now, 0.08);
    // Unsettling downward pitch sag paired with rising minor-9th shriek & binaural tinnitus
    setParam(dreadNodes.tritoneOsc.frequency, 134 - s * 23, now, 0.08);
    setParam(dreadNodes.shriekOsc.frequency, 277.18 + s * 34, now, 0.08);
    setParam(dreadNodes.tremorLfo.frequency, 6.0 + s * 11.0, now, 0.08);
    setParam(dreadNodes.tremorGain.gain, d * 4.5 + s * s * 14.0, now, 0.08);
    setParam(dreadNodes.lowFilter.frequency, 190 + d * 480 + s * 320, now, 0.08);
    setParam(dreadNodes.ringOsc.frequency, 3120 + s * 490, now, 0.08);
    setParam(dreadNodes.ringOsc2.frequency, 3127.5 + s * 504, now, 0.08);
  }

  function connectWithPan(node, panVal) {
    if (!ac || !master) return;
    if (typeof ac.createStereoPanner === 'function') {
      const panner = ac.createStereoPanner();
      panner.pan.setValueAtTime(Math.max(-1, Math.min(1, panVal || 0)), ac.currentTime);
      node.connect(panner);
      panner.connect(master);
    } else {
      node.connect(master);
    }
  }

  function toneStereo(type, f0, f1, dur, vol, pan, delay) {
    if (!ac) return;
    const t = ac.currentTime + (delay || 0);
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    connectWithPan(gain, pan);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  function noiseStereo(dur, vol, filterType, freq, pan, delay) {
    if (!ac) return;
    const t = ac.currentTime + (delay || 0);
    const len = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource();
    src.buffer = buf;

    const filter = ac.createBiquadFilter();
    filter.type = filterType || 'bandpass';
    filter.frequency.setValueAtTime(freq || 800, t);

    const gain = ac.createGain();
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    src.connect(filter);
    filter.connect(gain);
    connectWithPan(gain, pan);
    src.start(t);
  }

  // Haunted 1989 detuned music-box / warped VHS synth note with stereo ghost echo
  function playHauntedMusicBoxNote(freq, tension, pan) {
    if (!ac) return;
    const vol = 0.055 + tension * 0.05;
    const dur = 0.65 + (1 - tension) * 0.45;
    const detuneSag = 0.992 - tension * 0.006; // Sickening microtonal flat sag
    // Primary cold bell
    toneStereo('triangle', freq, freq * 0.997, dur, vol, pan, 0);
    // Warped detuned shadow voice
    toneStereo('sine', freq * 1.007, freq * detuneSag, dur * 1.1, vol * 0.72, -pan * 0.7, 0.03);
    // Ghostly tape-delay echo on opposite side
    toneStereo('sine', freq * 0.995, freq * 0.988, dur * 0.9, vol * 0.36, -pan, 0.28);
    // High tension adds a sinister tritone or minor-second overtone ping
    if (tension > 0.48) {
      const interval = tension > 0.75 ? 1.05946 : 1.4142; // minor 2nd or tritone
      toneStereo('sawtooth', freq * interval, freq * interval * 0.98, 0.32, vol * 0.32, pan * 0.5, 0.08);
    }
  }

  // John Carpenter / Clock Tower style dark analog stalking bass ostinato pulse
  function playThrillerBassPulse(freq, tension, vfActive) {
    if (!ac) return;
    const v = 0.09 + tension * 0.14 + (vfActive ? 0.05 : 0);
    const dur = Math.max(0.12, 0.28 - tension * 0.10);
    toneStereo('sawtooth', freq * 1.02, freq, dur, v * 0.55, 0, 0);
    toneStereo('triangle', freq * 0.5, freq * 0.49, dur * 1.15, v * 0.85, 0, 0);
    if (tension > 0.65 || vfActive) {
      // Metallic industrial tick on top of the bass pulse when in acute danger
      noiseStereo(0.035, v * 0.35, 'bandpass', 1650 + tension * 900, (Math.random() - 0.5) * 0.7, 0);
    }
  }

  // Eerie waterphone / bowed metal / Psycho string scrape in the dark woods
  function playWaterphoneScrape(pan, tension) {
    if (!ac) return;
    const baseF = 920 + Math.random() * 1100;
    const endF = baseF * (Math.random() < 0.5 ? 1.38 : 0.72);
    const dur = 0.55 + Math.random() * 0.55;
    const v = 0.04 + tension * 0.075;
    toneStereo('sawtooth', baseF, endF, dur, v * 0.65, pan, 0);
    toneStereo('sine', baseF * 1.06, endF * 0.97, dur * 1.1, v * 0.8, -pan * 0.6, 0.04);
    noiseStereo(dur * 0.8, v * 0.45, 'bandpass', baseF, pan, 0.02);
  }

  // Sudden horror jump-stinger when locking eyes with a close or coiled creature!
  function gazeDiscoveryStinger(pan, near, pose) {
    if (!ac) return;
    const v = 0.22 + 0.45 * Math.max(0, Math.min(1, near || 0.5));
    // Sub-bass heart-drop boom
    toneStereo('sine', 110, 28, 0.48, v * 0.95, 0, 0);
    // Piercing Psycho/Silent-Hill dissonant minor-second shriek cluster
    toneStereo('sawtooth', 587.33, 554.37, 0.36, v * 0.42, pan, 0);
    toneStereo('sawtooth', 622.25, 659.25, 0.38, v * 0.42, -pan * 0.6, 0.015);
    if (pose === 'LUNGE' || near > 0.65) {
      toneStereo('sawtooth', 1174.66, 1108.73, 0.28, v * 0.38, pan, 0.01);
      noiseStereo(0.24, v * 0.5, 'highpass', 1900, pan, 0);
    }
  }

  // Distant rolling storm thunder & sub-bass dread when lightning flashes
  function thunderRumble() {
    if (!ac) return;
    noiseStereo(0.95, 0.28, 'lowpass', 220, -0.35, 0.05);
    noiseStereo(1.25, 0.22, 'lowpass', 145, 0.35, 0.22);
    toneStereo('triangle', 58, 24, 0.9, 0.32, 0, 0.08);
  }

  // Crushing doom horn & broken music-box dirge on Game Over
  function gameOverDoomStinger() {
    if (!ac) return;
    toneStereo('sawtooth', 73.42, 36.71, 1.4, 0.48, 0, 0);
    toneStereo('sawtooth', 77.78, 38.89, 1.45, 0.42, -0.3, 0.02);
    toneStereo('sawtooth', 103.83, 51.91, 1.5, 0.38, 0.3, 0.04);
    noiseStereo(0.8, 0.35, 'lowpass', 320, 0, 0);
  }

  // Dynamic, state-reactive 16-bit survival horror soundtrack & stinger director
  function updateMusic(state, dt) {
    if (!ac || !state) return;
    ensureMusicNodes();
    if (!musicNodes) return;

    const stepDt = Math.max(0.001, Math.min(0.1, dt || 0.016));
    const now = ac.currentTime;
    const phase = state.phase || 'TITLE';
    const cockpit = state.cockpit || {};
    const nightNum = (state.night && state.night.number) || 1;

    // 1. Phase transition stingers
    if (musicState.lastPhase !== phase) {
      if (phase === 'GAME_OVER') {
        gameOverDoomStinger();
      } else if (phase === 'PLAYING') {
        musicState.creatureMem = {};
      }
      musicState.lastPhase = phase;
    }

    // 2. Victory / Summary calm down the oppressive horror drone
    if (phase === 'VICTORY' || phase === 'NIGHT_SUMMARY') {
      setParam(musicNodes.abyssGain.gain, 0.03, now, 0.2);
      setParam(musicNodes.padGain.gain, 0.015, now, 0.2);
      return;
    }

    // 3. Title & Night Intro: Eerie 1989 VHS dark ambient & haunted music box
    if (phase === 'TITLE' || phase === 'NIGHT_INTRO' || phase === 'GAME_OVER') {
      const introIntensity = phase === 'NIGHT_INTRO' ? 0.42 : (phase === 'GAME_OVER' ? 0.55 : 0.30);
      setParam(musicNodes.abyssGain.gain, 0.14 + introIntensity * 0.12, now, 0.15);
      setParam(musicNodes.padGain.gain, 0.06 + introIntensity * 0.06, now, 0.15);
      setParam(musicNodes.padFilter.frequency, 150 + introIntensity * 140, now, 0.15);
      setParam(musicNodes.wobbleLfo.frequency, 0.32 + introIntensity * 0.4, now, 0.15);
      setParam(musicNodes.wobbleGain.gain, 2.2 + introIntensity * 2.5, now, 0.15);

      musicState.noteTimer -= stepDt;
      if (musicState.noteTimer <= 0) {
        const hz = HORROR_MELODY_HZ[musicState.stepIdx % HORROR_MELODY_HZ.length];
        musicState.stepIdx = (musicState.stepIdx + 1) % HORROR_MELODY_HZ.length;
        const pan = ((musicState.stepIdx % 3) - 1) * 0.55;
        playHauntedMusicBoxNote(hz * (phase === 'GAME_OVER' ? 0.5 : 1), introIntensity, pan);
        musicState.noteTimer = phase === 'NIGHT_INTRO' ? 0.62 : 0.92;
      }
      return;
    }

    // 4. PLAYING PHASE: Calculate real-time survival-horror tension (0.0 -> 1.0)
    const creatures = state.creatures || [];
    let minDist = 1.0;
    let hasCoil = false;
    let hasLunge = false;
    let closestPan = 0;

    for (let i = 0; i < creatures.length; i++) {
      const c = creatures[i];
      const pan = c.dir === 'LEFT' ? -0.82 : c.dir === 'RIGHT' ? 0.82 : 0;
      if (c.dist < minDist) {
        minDist = c.dist;
        closestPan = pan;
      }
      if (c.pose === 'COIL') hasCoil = true;
      if (c.pose === 'LUNGE') hasLunge = true;

      // Track sudden gaze discovery & pose escalation stingers per creature
      const mem = musicState.creatureMem[c.id] || {
        wasGazed: false,
        lastPose: c.pose || 'WAIT',
        stingerCooldown: 0,
      };
      mem.stingerCooldown = Math.max(0, mem.stingerCooldown - stepDt);
      const isGazedNow = c.state === 'FROZEN';

      if (isGazedNow && !mem.wasGazed && mem.stingerCooldown <= 0) {
        // Player just turned their head and locked eyes with the creature!
        if (c.dist <= 0.58 || c.pose === 'COIL' || c.pose === 'LUNGE') {
          gazeDiscoveryStinger(pan, 1 - c.dist, c.pose);
          mem.stingerCooldown = 3.2;
        }
      } else if (c.pose === 'LUNGE' && mem.lastPose !== 'LUNGE' && mem.stingerCooldown <= 0) {
        // Creature just entered point-blank LUNGE pose!
        playWaterphoneScrape(pan, 0.95);
        mem.stingerCooldown = 2.5;
      }

      mem.wasGazed = isGazedNow;
      mem.lastPose = c.pose;
      musicState.creatureMem[c.id] = mem;
    }

    // Lightning flash thunder rumble
    const flashActive = (cockpit.lightningFlash || 0) > 0.20;
    if (flashActive && !musicState.wasLightning) {
      thunderRumble();
    }
    musicState.wasLightning = flashActive;

    const prox = Math.max(0, Math.min(1, 1 - minDist));
    const vfBoost = cockpit.vfActive ? 0.22 : 0; // Covering naked eyes with camera = extreme vulnerability!
    const poseBoost = hasLunge ? 0.32 : (hasCoil ? 0.16 : 0);
    const dreadBoost = (cockpit.stareDread || 0) * 0.25 + (cockpit.eyeStrain || 0) * 0.20;
    const nightBoost = (nightNum - 1) * 0.08;
    const tension = Math.max(0.08, Math.min(1.0, prox * 0.68 + vfBoost + poseBoost + dreadBoost + nightBoost));

    // Modulate continuous dark ambient abyssal drone & minor-second pad
    const targetAbyss = 0.14 + tension * 0.24;
    const targetPad = 0.05 + tension * tension * 0.16;
    setParam(musicNodes.abyssGain.gain, targetAbyss, now, 0.08);
    setParam(musicNodes.padGain.gain, targetPad, now, 0.08);

    // Subtle upward creep of the abyssal tritone + widening minor-second dissonance as IT gets closer
    setParam(musicNodes.abyssOsc.frequency, 36.71 + tension * 4.2, now, 0.1);
    setParam(musicNodes.fifthAbyssOsc.frequency, 51.91 - tension * 2.8, now, 0.1);
    setParam(musicNodes.darkPadOsc1.frequency, 73.42 + (cockpit.vfActive ? 3.5 : 0), now, 0.1);
    setParam(musicNodes.darkPadOsc2.frequency, 77.78 + tension * 5.2, now, 0.1);
    setParam(musicNodes.padFilter.frequency, 140 + tension * 620, now, 0.08);
    setParam(musicNodes.wobbleLfo.frequency, 0.25 + tension * 3.4, now, 0.1);
    setParam(musicNodes.wobbleGain.gain, 1.4 + tension * 6.5, now, 0.1);

    // 5. Sequencer Layer A: Haunted Music Box / Cold Horror Bell Motif
    musicState.noteTimer -= stepDt;
    if (musicState.noteTimer <= 0) {
      const idx = musicState.stepIdx % HORROR_MELODY_HZ.length;
      musicState.stepIdx += 1;
      let hz = HORROR_MELODY_HZ[idx];
      // Shift octave up in extreme danger for piercing panic
      if (tension > 0.78 && idx % 2 === 1) hz *= 2;
      const notePan = closestPan !== 0 ? closestPan * 0.65 : ((idx % 3) - 1) * 0.6;
      playHauntedMusicBoxNote(hz, tension, notePan);
      musicState.noteTimer = Math.max(0.28, 1.35 - tension * 0.92 + (Math.random() - 0.5) * 0.18);
    }

    // 6. Sequencer Layer B: Thriller Stalking Bass Ostinato (activates when creature approaches or camera is raised)
    if (tension > 0.28 || cockpit.vfActive) {
      musicState.pulseTimer -= stepDt;
      if (musicState.pulseTimer <= 0) {
        const bHz = THRILLER_BASS_HZ[musicState.pulseIdx % THRILLER_BASS_HZ.length];
        musicState.pulseIdx += 1;
        playThrillerBassPulse(bHz, tension, cockpit.vfActive);
        // Accelerates from 0.46s down to frantic 16th-note 0.14s pulse at point-blank range!
        musicState.pulseTimer = Math.max(0.14, 0.48 - tension * 0.32);
      }
    }

    // 7. Sequencer Layer C: Eerie Bowed Metal / Waterphone Scrapes in the Forest
    musicState.scrapeTimer -= stepDt;
    if (musicState.scrapeTimer <= 0) {
      if (tension > 0.22) {
        const scrapePan = closestPan !== 0 ? closestPan : (Math.random() < 0.5 ? -0.8 : 0.8);
        playWaterphoneScrape(scrapePan, tension);
      }
      musicState.scrapeTimer = Math.max(1.8, 5.8 - tension * 3.6 + Math.random() * 1.5);
    }
  }

  function afLockBeep() {
    // Crisp 1989 SLR camera electronic focus-confirmation double pip
    toneStereo('sine', 1980, 1980, 0.045, 0.16, 0, 0);
    toneStereo('sine', 2480, 2480, 0.055, 0.18, 0, 0.055);
  }

  function survivalStartStinger() {
    if (!ac) return;
    // Power-down pitch drop + rolling thunder + distant monster enrage roar
    toneStereo('sawtooth', 440, 48, 0.72, 0.42, 0, 0);
    toneStereo('triangle', 220, 32, 0.85, 0.48, 0, 0.03);
    thunderRumble();
    toneStereo('sawtooth', 185, 78, 0.92, 0.36, -0.35, 0.28);
    toneStereo('sawtooth', 194, 72, 0.95, 0.32, 0.35, 0.30);
    noiseStereo(0.75, 0.28, 'bandpass', 620, 0, 0.28);
  }

  function flashlightBlast() {
    if (!ac) return;
    // High-voltage halogen strobe discharge pop + capacitor recharge whine
    noiseStereo(0.055, 0.80, 'highpass', 1100, 0, 0);
    toneStereo('square', 640, 95, 0.14, 0.38, 0, 0);
    toneStereo('sine', 160, 42, 0.16, 0.45, 0, 0.01);
    toneStereo('sine', 950, 3600, 1.15, 0.10, 0.2, 0.12);
  }

  function playEvent(ev) {
    if (!ev) return;
    switch (ev.type) {
      case 'SWITCH_CLICK': switchClick(); break;
      case 'AF_LOCK': afLockBeep(); break;
      case 'SURVIVAL_START': survivalStartStinger(); break;
      case 'FLASHLIGHT_BLAST': flashlightBlast(); break;
      case 'FOOTSTEP': footstepStereo(ev.pan, ev.near); break;
      case 'METAL_SCRATCH': metalScratchStereo(ev.pan, ev.near); break;
      case 'SHUTTER_BLAST': shutterBlast(); break;
      case 'MONSTER_SCREAM':
        monsterScream(ev.dir === 'LEFT' ? -0.8 : ev.dir === 'RIGHT' ? 0.8 : 0);
        break;
      case 'GLASS_SHATTER': glassShatter(); break;
      case 'DAWN_CHIME': dawnChime(); break;
      case 'HEARTBEAT': heartbeat(ev.near); break;
      case 'RAIN_AMBIENCE': rainAmbience(ev.intensity); break;
      case 'BRANCH_SNAP': branchSnapStereo(ev.pan, ev.near); break;
      case 'BLINK_LURCH': blinkLurch(ev.pan, ev.near); break;
      case 'WINDOW_SLAM': windowSlamStereo(ev.pan); break;
      default: break;
    }
  }

  const API = {
    init,
    playEvent,
    updateStareDread,
    updateMusic,
    switchClick,
    footstepStereo,
    metalScratchStereo,
    shutterBlast,
    flashlightBlast,
    survivalStartStinger,
    monsterScream,
    glassShatter,
    dawnChime,
    heartbeat,
    rainAmbience,
    branchSnapStereo,
    blinkLurch,
    windowSlamStereo,
  };

  root.Evidence16BitAudio = API;
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = API;
  }
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
    (function () {
      const C = window.Evidence16BitCore;
      const R = window.Evidence16BitRender;
      const A = window.Evidence16BitAudio;

      const canvas = document.getElementById('screen');
      const ctx = canvas.getContext('2d');
      const params = Object.fromEntries(new URLSearchParams(location.search));
      const state = C.createGame(C.makeConfig(params), Date.now());
      if (params.autostart === '1') {
        C.startNight(state, Number(params.night) || 1);
        state.creatures[0].dir = 'FRONT';
        state.creatures[0].dist = 0.42;
      }

      const keys = {};
      let pendingShoot = false;
      let pendingAction = false;
      let mouseAimToggle = false;
      let btnLeftHold = false;
      let btnRightHold = false;

      window.addEventListener('pointerdown', () => A.init(), { passive: true });

      window.addEventListener('keydown', (e) => {
        A.init();
        keys[e.code] = true;
        if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyJ') {
          mouseAimToggle = false;
        }
        if (e.code === 'Space' || e.code === 'KeyK' || e.code === 'Enter') {
          e.preventDefault();
          pendingShoot = true;
          pendingAction = true;
        }
      });

      window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
      });

      canvas.addEventListener('mousedown', (e) => {
        A.init();
        if (e.button === 2) {
          mouseAimToggle = !mouseAimToggle;
        } else {
          pendingAction = true;
          if (state.phase === 'PLAYING') {
            pendingShoot = true;
          }
        }
      });
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      function bindHold(el, setFlag) {
        el.addEventListener('mousedown', () => { A.init(); setFlag(true); });
        el.addEventListener('mouseup', () => setFlag(false));
        el.addEventListener('mouseleave', () => setFlag(false));
        el.addEventListener('touchstart', (e) => { e.preventDefault(); A.init(); setFlag(true); });
        el.addEventListener('touchend', () => setFlag(false));
      }

      const btnLeftEl = document.getElementById('btnLeft');
      const btnRightEl = document.getElementById('btnRight');
      const btnAimEl = document.getElementById('btnAim');
      const btnShootEl = document.getElementById('btnShoot');

      bindHold(btnLeftEl, (v) => { btnLeftHold = v; });
      bindHold(btnRightEl, (v) => { btnRightHold = v; });
      btnAimEl.addEventListener('click', () => { A.init(); mouseAimToggle = !mouseAimToggle; });
      btnShootEl.addEventListener('click', () => {
        A.init();
        pendingAction = true;
        pendingShoot = true;
      });

      let lastIsSurvival = null;
      let lastTime = performance.now();
      function frame(now) {
        const dt = Math.min(0.1, (now - lastTime) / 1000);
        lastTime = now;

        const leftActive = Boolean(keys.KeyA || keys.ArrowLeft || btnLeftHold);
        const rightActive = Boolean(keys.KeyD || keys.ArrowRight || btnRightHold);
        const aimActive = Boolean(keys.ShiftLeft || keys.ShiftRight || keys.KeyJ || mouseAimToggle);

        btnLeftEl.classList.toggle('active', leftActive);
        btnRightEl.classList.toggle('active', rightActive);
        btnAimEl.classList.toggle('active', aimActive);

        const input = {
          left: leftActive,
          right: rightActive,
          aim: aimActive,
          shoot: pendingShoot,
          action: pendingAction,
        };
        pendingShoot = false;
        pendingAction = false;

        C.step(state, input, dt);
        const isSurvival = Boolean(state.night && state.night.subPhase === 'SURVIVAL');
        if (isSurvival !== lastIsSurvival) {
          lastIsSurvival = isSurvival;
          btnAimEl.textContent = isSurvival ? '[SHIFT] 舉起手電筒（聚光顯影）' : '[SHIFT] 舉起相機（遮住肉眼）';
          btnShootEl.textContent = isSurvival ? '[SPACE] 手電筒爆閃' : '[SPACE] 快門閃光';
        }
        for (const ev of state.events) {
          A.playEvent(ev);
        }
        if (state.phase === 'PLAYING') {
          A.updateStareDread(state.cockpit.stareDread, state.cockpit.eyeStrain);
        } else {
          A.updateStareDread(0, 0);
        }
        A.updateMusic(state, dt);

        R.draw(ctx, state);
        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
